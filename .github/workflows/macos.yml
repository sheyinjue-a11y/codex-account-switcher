name: macOS tests and app
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test isolated core
        working-directory: macos
        run: swift test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify shared sessions against official CLI using loopback only
        run: |
          set -euo pipefail
          python -m pip install -r requirements-test.txt
          case "$(uname -m)" in arm64) target=aarch64-apple-darwin;; *) target=x86_64-apple-darwin;; esac
          curl --fail --location --retry 3 "https://github.com/openai/codex/releases/download/rust-v0.154.0/codex-$target.tar.gz" -o "$RUNNER_TEMP/codex.tar.gz"
          mkdir -p "$RUNNER_TEMP/test-codex"
          tar -xzf "$RUNNER_TEMP/codex.tar.gz" -C "$RUNNER_TEMP/test-codex"
          python tools/chatgpt-account-switch/Test-SharedSessions.py --codex "$RUNNER_TEMP/test-codex/codex-$target"
          echo "CODEX_TEST_BINARY=$RUNNER_TEMP/test-codex/codex-$target" >> "$GITHUB_ENV"
      - name: Verify native warmup ordering with official Codex (loopback only)
        run: |
          set -euo pipefail
          swift build --package-path macos --product WarmupFixture
          bin_path=$(swift build --package-path macos --show-bin-path)
          python tools/chatgpt-account-switch/Test-AstraWarmupIntegration.py --codex "$CODEX_TEST_BINARY" --mac-driver "$bin_path/WarmupFixture"
      - name: Build universal app and render synthetic preview
        run: bash macos/scripts/build.sh
      - name: Check packaged non-GUI hook entry without credentials
        run: |
          python - <<'PY'
          import json, subprocess
          entry = 'dist/macos/Codex Account Switcher.app/Contents/MacOS/CodexAccountSwitcher'
          result = subprocess.run([entry, '--astra-warmup'], input=b'{broken', capture_output=True, timeout=10, check=True)
          assert not result.stderr
          assert json.loads(result.stdout)['decision'] == 'block'
          print('PASS: Packaged hook handles malformed input without starting the GUI.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: macOS-universal
          path: |
            dist/macos/Codex-Account-Switcher-macOS-universal.zip
            dist/macos/SHA256SUMS.txt
            dist/macos/macos-preview.png
            dist/macos/请先阅读.md
          if-no-files-found: error
