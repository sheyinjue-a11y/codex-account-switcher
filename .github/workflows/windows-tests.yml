name: Windows offline tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned official CLI for offline format checks
        shell: powershell
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'codex-cli.zip'
          $install = Join-Path $env:RUNNER_TEMP 'switcher-test-cli'
          curl.exe --fail --location --retry 3 --output $archive 'https://github.com/openai/codex/releases/download/rust-v0.154.0/codex-x86_64-pc-windows-msvc.exe.zip'
          if ($LASTEXITCODE -ne 0) { throw 'Official CLI download failed.' }
          Expand-Archive $archive -DestinationPath $install
          $binary = Get-ChildItem $install -Recurse -Filter 'codex-x86_64-pc-windows-msvc.exe' | Select-Object -First 1
          if (-not $binary) { throw 'Official CLI executable missing.' }
          Copy-Item $binary.FullName (Join-Path $install 'codex.exe')
          $install | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Run isolated PowerShell and WPF tests
        shell: powershell
        run: ./tools/chatgpt-account-switch/Test-All.ps1 -SkipSharedSessions
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify native warmup ordering with official Codex (loopback only)
        shell: powershell
        run: |
          python -m pip install -r requirements-test.txt
          if ($LASTEXITCODE -ne 0) { throw 'Test dependencies failed.' }
          python tools/chatgpt-account-switch/Test-AstraWarmupIntegration.py
          if ($LASTEXITCODE -ne 0) { throw 'Warmup integration failed.' }
      - name: Build sanitized Windows distribution
        shell: powershell
        run: |
          ./scripts/Export-PublicRelease.ps1 -Name codex-account-switcher-windows
          Move-Item -LiteralPath dist/codex-account-switcher-windows.zip -Destination dist/Codex-Account-Switcher-Windows.zip
          $hash = (Get-FileHash -LiteralPath dist/Codex-Account-Switcher-Windows.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Codex-Account-Switcher-Windows.zip" | Set-Content -LiteralPath dist/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-release
          path: |
            dist/Codex-Account-Switcher-Windows.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
