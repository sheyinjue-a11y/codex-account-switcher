name: Windows offline tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned official CLI for offline format checks
        shell: powershell
        run: |
          $release = Invoke-RestMethod 'https://api.github.com/repos/openai/codex/releases/tags/rust-v0.154.0'
          $asset = $release.assets | Where-Object name -eq 'codex-x86_64-pc-windows-msvc.exe.zip'
          if (-not $asset) { throw 'Pinned official CLI asset is unavailable.' }
          $archive = Join-Path $env:RUNNER_TEMP 'codex-cli.zip'
          $install = Join-Path $env:RUNNER_TEMP 'switcher-test-cli'
          Invoke-WebRequest $asset.browser_download_url -OutFile $archive
          Expand-Archive $archive -DestinationPath $install
          $binary = Get-ChildItem $install -Recurse -Filter 'codex-x86_64-pc-windows-msvc.exe' | Select-Object -First 1
          if (-not $binary) { throw 'Official CLI executable missing.' }
          Copy-Item $binary.FullName (Join-Path $install 'codex.exe')
          $install | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Run isolated PowerShell and WPF tests
        shell: powershell
        run: ./tools/chatgpt-account-switch/Test-All.ps1 -SkipSharedSessions
